name: API compatibility

on:
  pull_request:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-apidiff:
    name: api compatibility (pre-1.0, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Compare public API
        continue-on-error: true
        uses: joelanford/go-apidiff@v0.8.3
