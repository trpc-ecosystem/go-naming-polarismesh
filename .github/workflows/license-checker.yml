name: License checker

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "feat/**"
    paths:
      - "**/*.go"
      - ".licenserc.yaml"
      - ".github/workflows/license-checker.yml"
  pull_request:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "feat/**"
    paths:
      - "**/*.go"
      - ".licenserc.yaml"
      - ".github/workflows/license-checker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-license:
    name: check-license
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check license headers
        uses: apache/skywalking-eyes@v0.9.0
