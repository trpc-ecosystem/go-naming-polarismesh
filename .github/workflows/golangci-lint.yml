name: golangci-lint

on:
  push:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "release/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golangci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=30m --new-from-rev=origin/main
          skip-cache: true

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: typos
        uses: crate-ci/typos@v1.52.0
